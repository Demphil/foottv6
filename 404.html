<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة غير موجودة | فرجة</title>
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#173e32">
    <link rel="icon" href="/assets/images/favicon.svg" type="image/svg+xml">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; font-family: Tahoma, Arial, sans-serif; color: #f3f5f4; background: linear-gradient(120deg, #143e32, #20262c 48%, #43263e); }
        header { min-height: 76px; display: flex; align-items: center; padding: 16px 24px; border-bottom: 1px solid #ffffff24; background: #0d191b80; }
        .brand { display: flex; gap: 12px; align-items: center; color: inherit; text-decoration: none; font-size: 24px; font-weight: bold; }
        .brand img { width: 44px; height: 44px; object-fit: contain; }
        main { max-width: 680px; margin: 0 auto; padding: 100px 24px; text-align: center; }
        .status { margin: 0; color: #e8be59; font-size: 64px; font-weight: bold; }
        h1 { font-size: 26px; line-height: 1.6; margin: 20px 0 12px; }
        p { color: #ced4d2; line-height: 1.9; margin: 0 0 28px; }
        nav { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
        nav a { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 12px 20px; border: 1px solid #ffffff30; border-radius: 6px; color: #fff; text-decoration: none; background: #173e32; }
        nav a:last-child { background: #ffffff0a; }
        a:focus-visible { outline: 2px solid #e8be59; outline-offset: 4px; }
        @media (max-width: 480px) { main { padding-top: 72px; } h1 { font-size: 22px; } nav { flex-direction: column; } }
    </style>
</head>
<body>
    <header><a class="brand" href="/"><img src="/assets/images/fraja-logo.svg" alt="">فرجة</a></header>
    <main>
        <p class="status">404</p>
        <h1>هذا الرابط لم يعد متاحاً</h1>
        <p>يمكنك متابعة مباريات اليوم ونتائجها من الصفحة الرئيسية.</p>
        <nav aria-label="العودة إلى الموقع">
            <a href="/">جدول مباريات اليوم</a>
            <a href="/news.html">أخبار كرة القدم</a>
        </nav>
    </main>
</body>
</html>
