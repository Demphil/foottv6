    <style>
        body { margin: 0; background: #0c121c; color: white; font-family: sans-serif; }
        .controls { background: #1a2230; padding: 10px; display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }
        button { background: #2c3e50; border: none; color: white; padding: 8px 15px; cursor: pointer; border-radius: 3px; }
        button:hover { background: #34495e; }
        button.active { background: #c0392b; }
        #player-container { width: 100%; height: 70vh; background: black; display: flex; justify-content: center; align-items: center; }
        video, iframe { width: 100%; height: 100%; border: none; }
        .footer { padding: 15px; text-align: center; background: #1a2230; border-top: 2px solid #c0392b; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body>

<div class="controls" id="btn-group">
    <!-- الروابط الخاصة بك هنا كما هي -->
    <button onclick="loadStream(0, 'https://23.1kooralive.fun/albaplayer/live3/?serv=0?serv=2&amp;auth=livepass', true)">بث 1</button>
    <button onclick="loadStream(1, 'https://ffa1001.s3.us-east-2.amazonaws.com/live1/tracks-v1a1/mono.m3u8', false)">بث 1</button>
    <button onclick="loadStream(2, 'https://ffa1001.s3.us-east-2.amazonaws.com/live1/tracks-v1a1/mono.m3u8', false)">بث 2</button>
    <button onclick="loadStream(3, 'https://23.1kooralive.fun/albaplayer/live3/?serv=0?serv=2&amp;auth=livepass', true)">بث 3</button>
    <button onclick="loadStream(4, 'https://3.simokora.com/my-hls/h9asfma10d5/source/index.m3u8', false)">بث 4</button>
    <button onclick="loadStream(5, 'https://23.1kooralive.fun/albaplayer/live3/?serv=0?serv=2&amp;auth=kreem0090/?serv=2&amp;auth=livepass', true)">بث 5</button>
    <button onclick="loadStream(6, 'https://szgcmkjn.28585519.net:8443/hls/ulgk1vzsw8aqr.m3u8?s=iZJOaHz8pm9557mRufrD9w&e=1784506160', false)">بث 360p</button>

    <button onclick="location.reload()">تحديث</button>
</div>
    
<div id="player-container">
    <video id="video" controls autoplay muted></video>
</div>

<div class="footer">
    تنبيه: إذا توقف البث قم بالضغط على زر التحديث أو إختار مشغلاً آخر في الأعلى.
</div>

<script>
    var container = document.getElementById('player-container');
    var hls = new Hls();

    function loadStream(index, url, isIframe) {
        document.querySelectorAll('.controls button').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.controls button')[index].classList.add('active');

        if (hls) hls.destroy();

        if (isIframe) {
            container.innerHTML = `<iframe src="${url}" allowfullscreen allow="autoplay"></iframe>`;
        } else {
            container.innerHTML = `<video id="video" controls autoplay muted></video>`;
            var video = document.getElementById('video');
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        }
    }

    // هنا يتم محاكاة النقر على الزر الأول ليقوم بجلب الرابط الخاص به تلقائياً
    window.onload = function() {
        var firstButton = document.querySelector('.controls button');
        if(firstButton) {
            firstButton.click();
        }
    };
</script>

</body>
</html>
