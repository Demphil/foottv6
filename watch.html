  <style>
    :root {
      color-scheme: dark;
      --bg: #070b12;
      --panel: #101823;
      --line: #213043;
      --text: #f6f8fb;
      --muted: #a9b6c7;
      --accent: #31d084;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 78% 10%, rgba(49, 208, 132, 0.16), transparent 30%),
        linear-gradient(135deg, #070b12, #111827 62%, #09111d);
      color: var(--text);
      font-family: Cairo, Tahoma, Arial, sans-serif;
      padding: 24px;
    }

    main {
      width: min(560px, 100%);
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: clamp(24px, 5vw, 42px);
      text-align: center;
      box-shadow: 0 20px 70px rgba(0, 0, 0, 0.35);
    }

    img {
      width: 150px;
      height: auto;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.45rem, 6vw, 2.2rem);
      line-height: 1.25;
      letter-spacing: 0;
    }

    p {
      margin: 0 auto 24px;
      color: var(--muted);
      line-height: 1.8;
      max-width: 38rem;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 0 22px;
      border-radius: 6px;
      background: var(--accent);
      color: #04100b;
      font-weight: 800;
      text-decoration: none;
    }

    small {
      display: block;

  </style>
    <script defer src="/assets/js/client-security.js"></script>
</head>
<body>
  <main>
    <img src="/assets/images/fraja-logo.svg" alt="Fraja.online">
    <h1>المشاهدة انتقلت إلى المشغل الموحد</h1>
    <p>هذه الصفحة لم تعد تحتوي على مشغل محلي. روابط المباريات في Fraja.online تفتح الآن عبر المشغل الموحد الآمن على medic.cymru.</p>
    <a id="player-link" href="https://medic.cymru/" rel="noopener noreferrer">فتح المشغل الموحد</a>
    <small>لن يتم تحميل أي سكربت إعلانات أو مشغل محلي من هذه الصفحة.</small>
  </main>
  <script>
    (() => {
      const params = new URLSearchParams(window.location.search);
      const id = params.get("match_id") || params.get("id");
      const target = new URL("https://medic.cymru/");
      if (id) target.searchParams.set("match_id", id);
      document.getElementById("player-link").href = target.href;
      window.location.replace(target.href);
    })();
  </script>
</body>
