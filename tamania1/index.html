<html lang="ar" dir="rtl">
<head>

    <style>
        body {
            background: linear-gradient(to right, #4b2c64, #f83a7f);
            margin: 0;
            padding: 0;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            font-family: Arial, sans-serif;
        }
        .page-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px; /* تم تقليل المسافة قليلاً لتناسب التنبيه */
            width: 100%;
            max-width: 1000px;
            padding: 20px; /* إضافة حواف داخلية للشاشات الصغيرة */
            box-sizing: border-box;
        }
        h2 {
            font-size: 2.2em;
            margin: 0;
            margin-top: 10px;
        }
        
        /* تصميم صندوق التنبيه */
        .alert-box {
            background-color: rgba(255, 255, 255, 0.15); /* خلفية شفافة */
            border: 2px solid #ffd700; /* إطار ذهبي بارز */
            color: #ffd700; /* نص ذهبي */
            padding: 12px 20px;
            border-radius: 8px;
            width: 100%;
            font-size: 1.1em;
            font-weight: bold;
            box-sizing: border-box;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .alert-icon {
            margin-left: 8px;
            font-size: 1.2em;
        }

        /* تصميم أزرار السيرفرات */
        .servers-menu {
            display: flex;
            gap: 15px;
            margin-bottom: 5px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .servers-menu button {
            background-color: #ffffff;
            color: #4b2c64;
            border: 2px solid #ffffff;
            padding: 10px 25px;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .servers-menu button:hover, .servers-menu button.active {
            background-color: #4b2c64;
            color: #ffffff;
        }
        /* حاوية الفيديو */
        .iframe-container {
            width: 100%;
            height: 600px;
            position: relative;
            background-color: #000;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
        }

        /* جعل التصميم متجاوباً مع الهواتف */
        @media (max-width: 768px) {
            .iframe-container {
                height: 250px; /* تصغير المشغل في الهواتف */
            }
            .alert-box {
                font-size: 1em;
            }
        }
    </style>
</head>
<body>

<div class="controls" id="btn-group">
    <!-- الروابط الخاصة بك هنا كما هي -->
    <button onclick="loadStream(0, 'https://v3.site2026.top/broadcast/EP84XYS6e9kjTR8BT8JQmg/1787678295/1787678034/1/thman1.m3u8', false)">بث 1</button>
    <button onclick="loadStream(1, 'https://v3.site2026.top/broadcast/EP84XYS6e9kjTR8BT8JQmg/1787678295/1787678034/1/thman1.m3u8', false)">بث 2</button>
    <button onclick="loadStream(2, 'https://new.site20260.top/embed/1459?serv=2&amp;auth=kreem0090/?serv=2&amp;auth=livepass', true)">بث 3</button>
    <button onclick="loadStream(3, 'https://new.site20260.top/embed/1459?serv=2&amp;auth=kreem0090/?serv=2&amp;auth=livepass', true)">بث 4</button>
    <button onclick="loadStream(4, 'https://3.simokora.com/my-hls/h9asfma10d5/source/index.m3u8', false)">بث 5</button>
    

    <button onclick="location.reload()">تحديث</button>
</div>
    
<div id="player-container">
    <video id="video" controls autoplay muted></video>
</div>

<div class="footer">
    تنبيه: إذا توقف البث قم بالضغط على زر التحديث أو إختار مشغلاً آخر في الأعلى.
</div>

<script>
    var container = document.getElementById('player-container');
    var hls = new Hls();

    function loadStream(index, url, isIframe) {
        document.querySelectorAll('.controls button').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.controls button')[index].classList.add('active');

        if (hls) hls.destroy();

        if (isIframe) {
            container.innerHTML = `<iframe src="${url}" allowfullscreen allow="autoplay"></iframe>`;
        } else {
            container.innerHTML = `<video id="video" controls autoplay muted></video>`;
            var video = document.getElementById('video');
            hls = new Hls();
            hls.loadSource(url);
            hls.attachMedia(video);
            hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
        }
    }

    // هنا يتم محاكاة النقر على الزر الأول ليقوم بجلب الرابط الخاص به تلقائياً
    window.onload = function() {
        var firstButton = document.querySelector('.controls button');
        if(firstButton) {
            firstButton.click();
        }
    };
</script>

</body>
</html>
